<section class="hero" id="about-me">

    <img class="hero__nebula" src="{{ '/images/carina-nebula-james-webb-telescope-0e6f4b6-e1657640050807.jpeg.webp' | relative_url }}" alt="" width="1200" height="695" fetchpriority="high">
    <div class="hero__orbits"></div>
  </div>
  <div class="hero__meteors" aria-hidden="true">
    <span class="hero__meteor"></span>
    <span class="hero__meteor"></span>
