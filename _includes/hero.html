<section class="hero" id="about-me">
  <div class="hero__cosmos" aria-hidden="true">
    <img class="hero__artwork" src="{{ '/images/carina-illustrated-hero.jpg' | relative_url }}" alt="" width="1536" height="1024" fetchpriority="high">
  </div>
  <div class="hero__inner">
    <p class="hero__eyebrow">Astronomy · Astrophysics</p>
    <h1 class="hero__name">{{ site.author.name | escape }}</h1>
    <div class="hero__rule" aria-hidden="true"></div>
    <p class="hero__role">
      <span class="hero__role-text" data-rotator
        data-lines='["Welcome to my homepage","Exploring the birth of stars"]'>Welcome to my homepage</span>
    </p>
    <a class="hero__scroll" href="#main" target="_self" aria-label="Scroll to content">
      <span class="hero__scroll-label">Scroll</span>
      <span class="hero__scroll-line" aria-hidden="true"></span>
    </a>
  </div>
</section>
