<script>
  $(document).ready(function () {
    var total = document.getElementById('total_cit');
    var citations = document.getElementsByClassName('show_paper_citations');
    // Pages without citation counters do not need a network request.
    if (!total && !citations.length) return;
    {% if site.google_scholar_stats_use_cdn %}
    var base = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@';
    {% else %}
    var base = 'https://raw.githubusercontent.com/{{ site.repository }}/';
    {% endif %}
    $.getJSON(base + 'google-scholar-stats/gs_data.json', function (data) {
      if (!data) return;
      if (total && data.citedby != null) total.textContent = data.citedby;
      Array.prototype.forEach.call(citations, function (element) {
        var paper = (data.publications || {})[element.getAttribute('data')];
        if (paper && paper.num_citations != null) {
          element.textContent = '| Citations: ' + paper.num_citations;
        }
      });
    });
  });
</script>
